<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高雄市教育局｜心理諮商經費控管系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0d3b6e; --navy-mid:#1a5c96; --navy-light:#2e7fc1;
  --gold:#c8a84b; --gold-light:#f0d98a; --gold-pale:#fdf8ec;
  --white:#fff; --cream:#f8f7f4;
  --g100:#f4f5f7; --g200:#e8eaed; --g300:#d1d5db;
  --g400:#9aa1ad; --g600:#555d6b; --g800:#2c3340;
  --green:#2e7d32; --green-bg:#e8f5e9; --green-light:#c8e6c9;
  --red:#c62828; --red-bg:#ffebee;
  --orange:#bf6000; --orange-bg:#fff8e1;
  --blue:#1565c0; --blue-bg:#e3f2fd;
  --purple:#5e35b1; --purple-bg:#ede7f6;
  --teal:#00695c; --teal-bg:#e0f2f1;
  --r:10px; --r-sm:6px; --r-lg:16px;
  --sh:0 2px 12px rgba(13,59,110,.08);
  --sh2:0 8px 32px rgba(13,59,110,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--cream);color:var(--g800);min-height:100vh}

/* ── LOGIN SCREEN ── */
#login-screen{
  position:fixed;inset:0;z-index:999;
  background:var(--navy);
  display:flex;align-items:center;justify-content:center;
}
#login-screen::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 70% 30%, rgba(200,168,75,.12) 0%, transparent 60%),
             radial-gradient(ellipse at 20% 80%, rgba(46,127,193,.1) 0%, transparent 50%);
}
.login-card{
  position:relative;z-index:1;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(200,168,75,.25);
  border-radius:var(--r-lg);
  padding:2.5rem 2.25rem;
  width:min(380px,90vw);
  backdrop-filter:blur(8px);
  box-shadow:0 24px 64px rgba(0,0,0,.4);
}
.login-logo{text-align:center;margin-bottom:1.75rem}
.login-badge{
  display:inline-block;font-size:10px;letter-spacing:3px;
  color:var(--gold-light);border:1px solid rgba(200,168,75,.4);
  padding:3px 14px;border-radius:99px;margin-bottom:.75rem;
  font-family:'Noto Serif TC',serif;
}
.login-title{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:600;color:#fff;line-height:1.6;text-align:center}
.login-gold{width:36px;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-light));margin:.8rem auto 0;border-radius:2px}
.login-label{display:block;font-size:12px;color:rgba(255,255,255,.5);margin-bottom:5px;letter-spacing:.5px}
.login-input{
  width:100%;padding:11px 14px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.15);
  border-radius:var(--r-sm);color:#fff;
  font-size:15px;font-family:inherit;
  transition:border-color .15s,background .15s;
  letter-spacing:2px;
}
.login-input:focus{outline:none;border-color:var(--gold);background:rgba(255,255,255,.1)}
.login-input::placeholder{color:rgba(255,255,255,.25);letter-spacing:0}
.login-btn{
  width:100%;margin-top:1.25rem;
  padding:12px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--gold),#e8b84b);
  color:#fff;font-size:14px;font-weight:500;
  font-family:'Noto Serif TC',serif;letter-spacing:1px;
  border-radius:var(--r-sm);
  box-shadow:0 4px 16px rgba(200,168,75,.35);
  transition:opacity .15s,transform .1s;
}
.login-btn:hover{opacity:.9;transform:translateY(-1px)}
.login-btn:active{transform:translateY(0)}
.login-err{
  margin-top:.75rem;font-size:12px;color:#ef9a9a;
  text-align:center;min-height:18px;
}

/* ── MAIN APP ── */
#app{display:none}

/* TOPBAR */
.topbar{
  background:var(--navy);padding:.85rem 1.5rem;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  position:sticky;top:0;z-index:100;
}
.topbar-title{
  font-family:'Noto Serif TC',serif;
  font-size:15px;font-weight:600;color:#fff;
  display:flex;align-items:center;gap:10px;
}
.topbar-badge{
  font-size:10px;color:var(--gold-light);
  border:1px solid rgba(200,168,75,.35);
  padding:2px 10px;border-radius:99px;letter-spacing:2px;
  font-family:'Noto Sans TC',sans-serif;font-weight:400;
}
.topbar-right{display:flex;align-items:center;gap:12px}
.refresh-btn{
  font-size:12px;color:rgba(255,255,255,.6);background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);padding:5px 12px;border-radius:99px;
  cursor:pointer;font-family:inherit;transition:all .15s;
}
.refresh-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.logout-btn{
  font-size:12px;color:rgba(255,255,255,.5);cursor:pointer;
  background:none;border:none;font-family:inherit;
}
.logout-btn:hover{color:rgba(255,255,255,.85)}

/* TABS */
.tabs{background:var(--navy-mid);padding:0 1.5rem;display:flex;gap:2px}
.tab{
  font-size:13px;padding:.7rem 1.25rem;color:rgba(255,255,255,.55);
  cursor:pointer;border-bottom:2px solid transparent;
  transition:all .15s;font-family:inherit;background:none;border-top:none;border-left:none;border-right:none;
  white-space:nowrap;
}
.tab:hover{color:rgba(255,255,255,.85)}
.tab.active{color:#fff;border-bottom-color:var(--gold-light)}

/* MAIN CONTENT */
.main-content{max-width:1280px;margin:0 auto;padding:1.5rem 1.25rem 3rem}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* SECTION TITLE */
.sec-title{
  font-family:'Noto Serif TC',serif;
  font-size:16px;font-weight:600;color:var(--navy);
  margin-bottom:1.1rem;display:flex;align-items:center;gap:8px;
}
.sec-title::before{content:'';width:3px;height:18px;background:var(--gold);border-radius:2px;flex-shrink:0}

/* STAT CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:1.75rem}
.scard{
  background:var(--white);border-radius:var(--r);
  border:1px solid var(--g200);padding:1.1rem 1.25rem;
  box-shadow:var(--sh);position:relative;overflow:hidden;
}
.scard::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--c1,var(--navy)),var(--c2,var(--navy-light)));
}
.scard.green{--c1:var(--green);--c2:#66bb6a}
.scard.gold{--c1:var(--gold);--c2:var(--gold-light)}
.scard.blue{--c1:var(--blue);--c2:#42a5f5}
.scard.purple{--c1:var(--purple);--c2:#9575cd}
.scard.teal{--c1:var(--teal);--c2:#26a69a}
.scard.orange{--c1:var(--orange);--c2:#ffa726}
.scard-label{font-size:11px;color:var(--g400);font-weight:500;letter-spacing:.5px;margin-bottom:6px}
.scard-value{font-size:26px;font-weight:600;color:var(--g800);line-height:1.1}
.scard-unit{font-size:12px;color:var(--g400);margin-top:3px}

/* PANEL */
.panel{background:var(--white);border-radius:var(--r);border:1px solid var(--g200);box-shadow:var(--sh);margin-bottom:1.25rem}
.panel-head{padding:1rem 1.25rem;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.panel-title{font-size:13px;font-weight:500;color:var(--g800)}
.panel-body{padding:1.1rem 1.25rem}

/* FILTER ROW */
.filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filter-row>*{flex:1;min-width:150px}
.f-label{font-size:11px;color:var(--g400);font-weight:500;margin-bottom:4px;display:block}
input[type=text],select{
  width:100%;padding:9px 12px;
  border:1px solid var(--g200);border-radius:var(--r-sm);
  font-size:13px;font-family:inherit;color:var(--g800);
  background:var(--g100);transition:border-color .15s,background .15s;
  appearance:none;
}
input[type=text]:focus,select:focus{outline:none;border-color:var(--navy-light);background:var(--white)}
.btn{
  padding:9px 18px;border-radius:var(--r-sm);font-size:13px;
  font-family:inherit;cursor:pointer;border:none;font-weight:500;
  transition:all .12s;white-space:nowrap;
}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-mid)}
.btn-outline{background:var(--white);color:var(--g600);border:1px solid var(--g200)}
.btn-outline:hover{border-color:var(--navy-mid);color:var(--navy)}

/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-sm);border:1px solid var(--g200)}
table{width:100%;border-collapse:collapse;min-width:600px}
thead tr{background:var(--navy)}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:500;color:rgba(255,255,255,.85);white-space:nowrap;letter-spacing:.5px}
tbody tr{border-bottom:1px solid var(--g200);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--g100)}
td{padding:10px 14px;font-size:13px;color:var(--g600);vertical-align:middle}
td.bold{font-weight:500;color:var(--g800)}
td.center{text-align:center}
td.right{text-align:right}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:4px;font-weight:500}
.chip-blue{background:var(--blue-bg);color:var(--blue)}
.chip-green{background:var(--green-bg);color:var(--green)}
.chip-orange{background:var(--orange-bg);color:var(--orange)}
.chip-red{background:var(--red-bg);color:var(--red)}
.chip-purple{background:var(--purple-bg);color:var(--purple)}

/* PROGRESS BAR */
.prog-wrap{background:var(--g200);border-radius:99px;height:6px;overflow:hidden;min-width:80px}
.prog-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--navy-mid),var(--navy-light));transition:width .4s}
.prog-bar.warn{background:linear-gradient(90deg,var(--orange),#ffa726)}
.prog-bar.danger{background:linear-gradient(90deg,var(--red),#ef5350)}

/* ID LOOKUP */
.id-result{background:var(--gold-pale);border:1px solid rgba(200,168,75,.3);border-radius:var(--r);padding:1.25rem;margin-top:1rem}
.id-name{font-family:'Noto Serif TC',serif;font-size:17px;font-weight:600;color:var(--navy);margin-bottom:.75rem}
.id-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:1rem}
.id-kv{background:var(--white);border-radius:var(--r-sm);padding:.75rem 1rem;border:1px solid var(--g200)}
.id-kv .k{font-size:11px;color:var(--g400);margin-bottom:3px}
.id-kv .v{font-size:18px;font-weight:600;color:var(--g800)}
.id-kv .unit{font-size:11px;color:var(--g400);margin-left:2px}
.quota-bar{margin-top:.5rem}
.quota-label{font-size:11px;color:var(--g600);margin-bottom:4px;display:flex;justify-content:space-between}
.id-dates{margin-top:.75rem}
.id-dates-title{font-size:12px;color:var(--g400);font-weight:500;margin-bottom:.5rem;letter-spacing:.5px}
.date-chips{display:flex;gap:6px;flex-wrap:wrap}
.date-chip{background:var(--white);border:1px solid var(--g200);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--g600)}

/* PAGINATION */
.pager{display:flex;justify-content:center;gap:5px;padding:1rem;flex-wrap:wrap}
.pager button{font-size:12px;padding:5px 10px;border-radius:5px;border:1px solid var(--g200);background:var(--white);color:var(--g600);cursor:pointer;font-family:inherit;transition:all .12s}
.pager button:hover{border-color:var(--navy-mid);color:var(--navy)}
.pager button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.pager button:disabled{opacity:.35;cursor:default}

/* META */
.result-meta{font-size:12px;color:var(--g400);margin-bottom:.75rem;display:flex;align-items:center;gap:6px}
.meta-badge{background:var(--navy);color:#fff;font-size:11px;padding:1px 9px;border-radius:99px}

/* LOADING */
.loading-box{text-align:center;padding:3rem;color:var(--g400)}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid var(--g200);border-top-color:var(--navy-mid);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:.75rem}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:var(--red-bg);border:1px solid #ffcdd2;border-radius:var(--r);padding:1.25rem;color:var(--red);font-size:13px}

/* FOOTER */
footer{text-align:center;padding:1.5rem;font-size:11px;color:var(--g400);border-top:1px solid var(--g200);margin-top:1rem;line-height:2.2}
footer strong{color:var(--navy);font-weight:500}

@media(max-width:600px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .filter-row>*{min-width:100%}
  .topbar-badge{display:none}
}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-badge">高雄市政府教育局</div>
      <div class="login-title">115年心理諮商<br>經費控管系統</div>
      <div class="login-gold"></div>
    </div>
    <div style="margin-bottom:1rem">
      <span class="login-label">系統密碼</span>
      <input class="login-input" type="password" id="pw-input" placeholder="請輸入系統密碼" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">登　入</button>
    <div class="login-err" id="login-err"></div>
    <div style="text-align:center;margin-top:1.25rem;font-size:11px;color:rgba(255,255,255,.25)">本系統限授權承辦人員使用</div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <div class="topbar">
    <div class="topbar-title">
      <span>心理諮商經費控管系統</span>
      <span class="topbar-badge">115年度</span>
    </div>
    <div class="topbar-right">
      <span id="last-update-label" style="font-size:11px;color:rgba(255,255,255,.4)"></span>
      <button class="refresh-btn" onclick="loadData()">↻ 重新整理</button>
      <button class="logout-btn" onclick="doLogout()">登出</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab(0)">📊 總覽儀表板</button>
    <button class="tab" onclick="switchTab(1)">🔍 識別碼查詢</button>
    <button class="tab" onclick="switchTab(2)">🏢 機構統計</button>
    <button class="tab" onclick="switchTab(3)">📋 填報明細</button>
  </div>

  <div class="main-content">

    <!-- ── TAB 0：總覽 ── -->
    <div class="tab-pane active" id="tab-0">
      <div id="overview-loading" class="loading-box">
        <div class="spinner"></div><div>資料載入中…</div>
      </div>
      <div id="overview-content" style="display:none">
        <div class="stats-grid" id="stats-cards"></div>
        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">當月統計（依月份篩選）</span>
            <select id="month-select" onchange="renderMonthStats()" style="max-width:160px;margin:0">
              <option value="">── 選擇月份 ──</option>
            </select>
          </div>
          <div class="panel-body">
            <div class="stats-grid" id="month-cards">
              <div style="color:var(--g400);font-size:13px;grid-column:1/-1">請選擇上方月份</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── TAB 1：識別碼查詢 ── -->
    <div class="tab-pane" id="tab-1">
      <div class="panel">
        <div class="panel-head"><span class="panel-title">識別碼查詢</span></div>
        <div class="panel-body">
          <div class="filter-row" style="align-items:flex-end">
            <div>
              <span class="f-label">使用者補助識別碼</span>
              <input type="text" id="id-input" placeholder="例如：AE71981220" oninput="searchID()" style="text-transform:uppercase">
            </div>
          </div>
          <div id="id-result-area" style="margin-top:1rem">
            <div style="color:var(--g400);font-size:13px">請輸入識別碼進行查詢</div>
          </div>
        </div>
      </div>
      <!-- 識別碼列表 -->
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">所有使用者清單</span>
          <span id="id-list-meta" class="meta-badge" style="font-size:11px;padding:2px 10px;border-radius:99px;background:var(--navy);color:#fff"></span>
        </div>
        <div class="panel-body" style="padding:0">
          <div class="tbl-wrap">
            <table>
              <thead>
                <tr>
                  <th>識別碼</th>
                  <th style="text-align:center">使用次數</th>
                  <th style="text-align:center">使用時數</th>
                  <th style="text-align:center">可核銷金額</th>
                  <th style="text-align:center">剩餘次數</th>
                  <th>使用進度</th>
                  <th>最後使用日</th>
                </tr>
              </thead>
              <tbody id="id-tbody"></tbody>
            </table>
          </div>
          <div class="pager" id="id-pager"></div>
        </div>
      </div>
    </div>

    <!-- ── TAB 2：機構統計 ── -->
    <div class="tab-pane" id="tab-2">
      <div class="panel">
        <div class="panel-head"><span class="panel-title">各機構申請經費統計</span></div>
        <div class="panel-body" style="padding:0">
          <div class="tbl-wrap">
            <table>
              <thead>
                <tr>
                  <th>機構名稱</th>
                  <th style="text-align:center">填報次數</th>
                  <th style="text-align:center">服務人次</th>
                  <th style="text-align:center">服務時數</th>
                  <th style="text-align:right">可申請經費</th>
                  <th>佔總經費比例</th>
                </tr>
              </thead>
              <tbody id="org-tbody"></tbody>
              <tfoot id="org-tfoot"></tfoot>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- ── TAB 3：填報明細 ── -->
    <div class="tab-pane" id="tab-3">
      <div class="panel">
        <div class="panel-head"><span class="panel-title">篩選條件</span></div>
        <div class="panel-body">
          <div class="filter-row">
            <div>
              <span class="f-label">機構名稱</span>
              <select id="d-org" onchange="applyDetailFilter()">
                <option value="">── 全部機構 ──</option>
              </select>
            </div>
            <div>
              <span class="f-label">填報月份</span>
              <select id="d-month" onchange="applyDetailFilter()">
                <option value="">── 全部月份 ──</option>
              </select>
            </div>
            <div>
              <span class="f-label">關鍵字（識別碼等）</span>
              <input type="text" id="d-keyword" placeholder="輸入關鍵字…" oninput="applyDetailFilter()">
            </div>
            <div>
              <span class="f-label">異常狀態</span>
              <select id="d-status" onchange="applyDetailFilter()">
                <option value="">── 全部資料 ──</option>
                <option value="anomaly">⚠ 僅顯示異常</option>
                <option value="ok">✓ 僅顯示正常</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="result-meta" id="detail-meta" style="display:flex;align-items:center;gap:8px"></div>
      <span id="detail-anomaly-badge" style="display:none;font-size:11px;padding:2px 9px;border-radius:99px;background:var(--red-bg);color:var(--red);margin-bottom:8px;margin-left:4px"></span>
      <div class="panel">
        <div class="panel-body" style="padding:0">
          <div class="tbl-wrap">
            <table>
              <thead>
                <tr>
                  <th>填報日期</th>
                  <th>機構名稱</th>
                  <th style="text-align:center">人次</th>
                  <th style="text-align:center">時數</th>
                  <th style="text-align:right">當筆金額</th>
                  <th>識別碼狀態</th>
                </tr>
              </thead>
              <tbody id="detail-tbody"></tbody>
            </table>
          </div>
          <div class="pager" id="detail-pager"></div>
        </div>
      </div>
    </div>

  </div><!-- /main-content -->

  <footer>
    <strong>高雄市政府教育局　人事室</strong><br>
    <br>
    資料來源：Google 表單即時同步　｜　最後更新：<span id="last-update">—</span>
  </footer>
</div>

<script>
/* ══════════════════════════════════════════════════

const API_URL  = 'https://script.google.com/macros/s/AKfycbyOGvPE0HfTno94sc_EI-nGEbL4cM9m7ukWsgXV6W2RHxDpZWlECaqoXK2LvUwY5KGGPQ/exec';  // 您的 Apps Script /exec 網址
const PASSWORD = 'khedu2025';                  // 系統登入密碼（請自行更改）

/* 規則 */
const PRICE_PER_HOUR = 1600;

/* 欄位名稱（對應您的 Google 試算表） */
/* ══ 欄位名稱動態偵測（解決空白/括號不一致導致識別碼消失的問題）══ */
let C = {};

function detectColumns(sampleRow){
  const keys=Object.keys(sampleRow);
  function find(...keywords){
    // 找出同時包含所有關鍵字的欄位名稱
    return keys.find(k=>keywords.every(kw=>k.includes(kw)))||'';
  }
  C={
    org:     find('機構','名稱'),
    date:    find('填報','日期'),
    persons: find('使用人次'),
    hours:   find('使用總時數'),
    p1_id:   find('第1人','識別碼'),
    p1_date: find('第1人','服務日期'),
    p1_hrs:  find('第1人','服務時數'),
    p2_id:   find('第2人','識別碼'),
    p2_date: find('第2人','服務日期'),
    p2_hrs:  find('第2人','服務時數'),
    p3_id:   find('第3人','識別碼'),
    p3_date: find('第3人','服務日期'),
    p3_hrs:  find('第3人','服務時數'),
    p4_id:   find('第4人','識別碼'),
    p4_date: find('第4人','服務日期'),
    p4_hrs:  find('第4人','服務時數'),
    p5_id:   find('第5人','識別碼'),
    p5_date: find('第5人','服務日期'),
    p5_hrs:  find('第5人','服務時數'),
    p6_id:   find('第6人','識別碼'),
    p6_date: find('第6人','服務日期'),
    p6_hrs:  find('第6人','服務時數'),
  };
  console.log('✓ 欄位偵測結果：',JSON.stringify(C,null,2));
}

/* ── 狀態 ── */
let allRows   = [];
let idMap     = {};   // 識別碼 → { sessions:[{date,hours,org}], totalHours }
let orgMap    = {};   // 機構名 → { rows, persons, hours }
let detailFiltered = [];
let detailPage = 1;
let idListPage = 1;
const PAGE_SZ = 20;

/* ══ 工具函數 ══ */
function parseNum(v){
  if(v===null||v===undefined||v==='') return 0;
  // 清除換行、移除中文單位
  const cleaned=String(v).replace(/\n|\r/g,'').replace(/小時|人次/g,'').replace(/[人時次]/g,'').trim();
  const n=parseFloat(cleaned);
  return isNaN(n)?0:n;
}
function excelToRoc(v){
  if(!v) return '—';
  const s=String(v).replace(/\n|\r/g,'').trim();
  if(!s||s==='0') return '—';

  // 格式1：民國7碼 1150430
  if(/^\d{7}$/.test(s)) return s.slice(0,3)+'/'+s.slice(3,5)+'/'+s.slice(5,7);

  // 格式2：完整日期字串 Mon May 04 2026...
  const d=new Date(s);
  if(!isNaN(d.getTime())&&d.getFullYear()>1900){
    const y=d.getFullYear()-1911;
    const m=String(d.getMonth()+1).padStart(2,'0');
    const day=String(d.getDate()).padStart(2,'0');
    return y+'/'+m+'/'+day;
  }

  // 格式3：ISO 字串 2026-05-04
  const isoMatch=s.match(/(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})/);
  if(isoMatch){
    const y=parseInt(isoMatch[1])-1911;
    const m=String(isoMatch[2]).padStart(2,'0');
    const day=String(isoMatch[3]).padStart(2,'0');
    return y+'/'+m+'/'+day;
  }

  // 格式4：Excel 數字序號
  const num=parseFloat(s);
  if(!isNaN(num)&&num>40000){
    const d2=new Date(Math.round((num-25569)*86400*1000));
    const y=d2.getFullYear()-1911;
    const m=String(d2.getMonth()+1).padStart(2,'0');
    const day=String(d2.getDate()).padStart(2,'0');
    return y+'/'+m+'/'+day;
  }
  return s;
}

function getMonthKey(row){
  const ts=row['時間戳記'];
  if(!ts||String(ts).trim()==='') return '—';
  const s=String(ts).replace(/\n|\r/g,'').trim();

  // 格式1：Mon May 04 2026 21:53:12 GMT+0800 (台北標準時間)
  // 直接用 new Date() 解析，最萬用
  const d=new Date(s);
  if(!isNaN(d.getTime())){
    const y=d.getFullYear()-1911;
    const m=String(d.getMonth()+1).padStart(2,'0');
    return y+'年'+m+'月';
  }

  // 格式2：ISO 字串 2026-05-04T...
  const isoMatch=s.match(/(\d{4})[\-\/](\d{1,2})/);
  if(isoMatch){
    const y=parseInt(isoMatch[1])-1911;
    const m=String(parseInt(isoMatch[2])).padStart(2,'0');
    return y+'年'+m+'月';
  }

  // 格式3：Excel 數字序號
  const num=parseFloat(s);
  if(!isNaN(num)&&num>40000){
    const d2=new Date(Math.round((num-25569)*86400*1000));
    const y=d2.getFullYear()-1911;
    const m=String(d2.getMonth()+1).padStart(2,'0');
    return y+'年'+m+'月';
  }
  return '—';
}

function fmtMoney(n){ return "NT$ "+Math.round(n).toLocaleString(); }
function pct(a,b){ return b===0?0:Math.round(a/b*100); }

/* ══ 登入 / 登出 ══ */

/* ══ 資料處理 ══ */
function buildIdMap(rows){
  const m={};
  const pFields=[
    {idKey:'p1_id',dateKey:'p1_date',hrsKey:'p1_hrs'},
    {idKey:'p2_id',dateKey:'p2_date',hrsKey:'p2_hrs'},
    {idKey:'p3_id',dateKey:'p3_date',hrsKey:'p3_hrs'},
    {idKey:'p4_id',dateKey:'p4_date',hrsKey:'p4_hrs'},
    {idKey:'p5_id',dateKey:'p5_date',hrsKey:'p5_hrs'},
    {idKey:'p6_id',dateKey:'p6_date',hrsKey:'p6_hrs'},
  ];
  rows.forEach(row=>{
    const org=(row[C.org]||'').trim();
    if(!org) return;  // ✓ 過濾空列（無機構名稱）
    pFields.forEach(f=>{
      const colId=C[f.idKey]; const colDate=C[f.dateKey]; const colHrs=C[f.hrsKey];
      if(!colId) return;  // ✓ 欄位未偵測到則略過
      const rawId=(row[colId]||'').toString().replace(/\n|\r/g,'').trim().toUpperCase();
      // ✓ 過濾空白及無效識別碼（須含英文字母且至少4字元）
      if(!rawId||rawId.length<4||!/[A-Z]/.test(rawId)) return;
      const d=excelToRoc(row[colDate]||'');
      const h=parseNum(row[colHrs])||1;
      if(!m[rawId]) m[rawId]={sessions:[],totalHours:0};
      m[rawId].sessions.push({date:d,hours:h,org});
      m[rawId].totalHours+=h;
    });
  });
  return m;
}

function buildOrgMap(rows){
  const m={};
  rows.forEach(row=>{
    const org=(row[C.org]||'').trim();
    if(!org) return;
    const p=parseNum(row[C.persons]);
    const h=parseNum(row[C.hours]);
    if(!m[org]) m[org]={rowCount:0,persons:0,hours:0};
    m[org].rowCount++;
    m[org].persons+=p;
    m[org].hours+=h;
  });
  return m;
}

/* ══ 載入資料 ══ */
async function loadData(){
  document.getElementById('overview-loading').style.display='block';
  document.getElementById('overview-content').style.display='none';
  try{
    const res=await fetch(API_URL);
    const data=await res.json();
    allRows=Array.isArray(data)?data:[];
    if(allRows.length>0) detectColumns(allRows[0]);  // ✓ 動態偵測欄位名稱
    idMap=buildIdMap(allRows);
    orgMap=buildOrgMap(allRows);
    const now=new Date().toLocaleString('zh-TW');
    document.getElementById('last-update').textContent=now;
    document.getElementById('last-update-label').textContent=now+' 更新';
    buildFilters();
    renderOverview();
    renderIDList();
    renderOrgTable();
    detailFiltered=[...allRows];
    renderDetailTable();
    document.getElementById('overview-loading').style.display='none';
    document.getElementById('overview-content').style.display='block';
  } catch(e){
    document.getElementById('overview-loading').innerHTML=
      '<div class="error-box">⚠️ 資料載入失敗，請確認 API 網址設定是否正確，且 Apps Script 權限已設為「任何人」。<br><small>'+e.message+'</small></div>';
    console.error(e);
  }
}

/* ══ 識別碼查詢 ══ */
function searchID(){
  const q=document.getElementById('id-input').value.trim().toUpperCase();
  const area=document.getElementById('id-result-area');
  if(q.length<4){area.innerHTML='<div style="color:var(--g400);font-size:13px">請輸入至少4個字元</div>';return;}
  const matches=Object.keys(idMap).filter(k=>k.includes(q));
  if(matches.length===0){area.innerHTML='<div style="color:var(--g400);font-size:13px">查無符合識別碼</div>';return;}

  area.innerHTML=matches.map(id=>{
    const d=idMap[id];
    const sessions=d.sessions.length;
    const hrs=d.totalHours;
    const usedTimes=hrs;                         // 次數 = 時數（1小時=1次，1.5小時=1.5次）
    const amt=hrs*PRICE_PER_HOUR;
    const remain=MAX_SESSIONS-usedTimes;
    const p=pct(usedTimes,MAX_SESSIONS);
    const barClass=p>=100?'danger':p>=75?'warn':'';
    const dates=[...new Set(d.sessions.map(s=>s.date))].sort();
    return `<div class="id-result">
      <div class="id-name">識別碼：${id}</div>
      <div class="id-grid">
        <div class="id-kv"><div class="k">使用次數（以時數計）</div><div class="v">${usedTimes.toFixed(1)}<span class="unit"> 次</span></div></div>
        <div class="id-kv"><div class="k">使用時數</div><div class="v">${hrs.toFixed(1)}<span class="unit"> 小時</span></div></div>
        <div class="id-kv"><div class="k">可核銷金額</div><div class="v" style="font-size:15px">${fmtMoney(amt)}</div></div>
        <div class="id-kv"><div class="k">剩餘次數</div><div class="v" style="color:${remain<=0?'var(--red)':'var(--green)'}">${remain<=0?'已達上限':remain.toFixed(1)}<span class="unit"> 次</span></div></div>
      </div>
      <div class="quota-bar">
        <div class="quota-label"><span>使用進度（上限12次／12小時）</span><span>${usedTimes.toFixed(1)} / ${MAX_SESSIONS} 次</span></div>
        <div class="prog-wrap"><div class="prog-bar ${barClass}" style="width:${Math.min(p,100)}%"></div></div>
      </div>
      <div class="id-dates">
        <div class="id-dates-title">使用日期紀錄</div>
        <div class="date-chips">${dates.map(dt=>`<span class="date-chip">${dt}</span>`).join('')}</div>
      </div>
    </div>`;
  }).join('');
}

/* ══ 識別碼列表 ══ */
function renderIDList(){
  const all=Object.entries(idMap).map(([id,d])=>({id,sessions:d.sessions.length,hours:d.totalHours,lastDate:[...d.sessions].sort((a,b)=>b.date.localeCompare(a.date))[0]?.date||'—'}));

  const rows=all.slice(start,start+PAGE_SZ);
  document.getElementById('id-tbody').innerHTML=rows.map(r=>{
    const usedTimes=r.hours;                     // 次數 = 時數（1小時=1次，1.5小時=1.5次）

    const p=pct(usedTimes,MAX_SESSIONS);
    const barClass=p>=100?'danger':p>=75?'warn':'';

    const remainStr=remain<=0?'已達上限':remain.toFixed(1)+' 次';
    const chip=remain<=0?'<span class="chip chip-red">已達上限</span>':p>=75?'<span class="chip chip-orange">'+remainStr+'</span>':'<span class="chip chip-green">'+remainStr+'</span>';
    return `<tr>
      <td><span class="chip chip-blue">${r.id}</span></td>
      <td class="center bold">${usedTimes.toFixed(1)}</td>
      <td class="center">${r.hours.toFixed(1)}</td>
      <td class="right">${fmtMoney(amt)}</td>
      <td class="center">${chip}</td>
      <td><div class="prog-wrap" style="min-width:100px"><div class="prog-bar ${barClass}" style="width:${Math.min(p,100)}%"></div></div></td>
      <td>${r.lastDate}</td>
    </tr>`;
  }).join('');
  renderPager('id',all.length,idListPage,p=>{idListPage=p;renderIDList();});
}

  ['d-org'].forEach(id=>{
    const sel=document.getElementById(id);
    sel.innerHTML='<option value="">── 全部機構 ──</option>';
    orgs.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;sel.appendChild(op);});
  });
  // 月份選單固定 115年 1～12 月
  ['d-month'].forEach(id=>{
    const sel=document.getElementById(id);
    sel.innerHTML='<option value="">── 全部月份 ──</option>';
    for(let i=1;i<=12;i++){
      const key='115年'+String(i).padStart(2,'0')+'月';
      const label='115年 '+i+' 月';
      const op=document.createElement('option');
      op.value=key; op.textContent=label; sel.appendChild(op);
    }
  });
}

function getRowIdStatus(r){
  const pFieldDefs=[
    {idKey:'p1_id'},{idKey:'p2_id'},{idKey:'p3_id'},
    {idKey:'p4_id'},{idKey:'p5_id'},{idKey:'p6_id'},
  ];
  const p=parseNum(r[C.persons]);
  const filled=pFieldDefs.map(f=>(r[C[f.idKey]]||'').toString().replace(/\n|\r/g,'').trim().toUpperCase()).filter(id=>id.length>=4&&/[A-Z]/.test(id));
  const missing=Math.max(0,p-filled.length);
  if(missing>0) return 'anomaly';
  for(const id of filled){
    const v=validateId(id);
    if(v.status==='danger'||v.status==='warn') return 'anomaly';
  }
  return 'ok';
}

function applyDetailFilter(){
  const org=document.getElementById('d-org').value;
  const month=document.getElementById('d-month').value;
  const kw=document.getElementById('d-keyword').value.trim().toLowerCase();
  const st=document.getElementById('d-status').value;
  detailFiltered=allRows.filter(r=>{
    if(!(r[C.org]||'').trim()) return false;
    if(org&&(r[C.org]||'').trim()!==org) return false;
    if(month&&getMonthKey(r)!==month) return false;
    if(kw){const s=Object.values(r).map(v=>String(v||'').toLowerCase()).join(' ');if(!s.includes(kw)) return false;}
    if(st==='anomaly'&&getRowIdStatus(r)!=='anomaly') return false;
    if(st==='ok'&&getRowIdStatus(r)!=='ok') return false;
    return true;
  });
  detailPage=1;
  const anomalyCount=allRows.filter(r=>(r[C.org]||'').trim()&&getRowIdStatus(r)==='anomaly').length;
  const badge=document.getElementById('detail-anomaly-badge');
  if(anomalyCount>0){badge.textContent='⚠ 共 '+anomalyCount+' 筆異常';badge.style.display='inline-block';}
  else{badge.style.display='none';}
  renderDetailTable();
}

/* ── 識別碼驗證 ── */
function validateId(id){
  if(!id||id.trim()==='') return {status:'missing',msg:''};
  const s=id.trim().toUpperCase();
  if(s.length<4||!/[A-Z]/.test(s)) return {status:'danger',msg:'格式嚴重異常'};
  if(!/^[AB]/.test(s)) return {status:'warn',msg:'第一碼「'+s[0]+'」非 A 或 B'};
  if(s.length!==10) return {status:'warn',msg:'長度'+s.length+'碼（應為10碼）'};
  if(!/^[AB][A-Z]\d{8}$/.test(s)) return {status:'warn',msg:'結構不符規則'};
  return {status:'ok',msg:''};
}

function rowIdStatus(ids,persons){
  const filled=ids.filter(i=>i.id);
  const missing=persons-filled.length;
  if(missing>0||filled.some(i=>validateId(i.id).status==='danger')) return 'danger';
  if(filled.some(i=>validateId(i.id).status==='warn')) return 'warn';
  return 'ok';
}

let _detailExpandState={};

function toggleDetailRow(idx){
  _detailExpandState[idx]=!_detailExpandState[idx];
  renderDetailTable();
}

function renderDetailTable(){
  const total=detailFiltered.length;
  document.getElementById('detail-meta').innerHTML='查詢結果　<span class="meta-badge">共 '+total+' 筆</span>';
  const start=(detailPage-1)*PAGE_SZ;
  const rows=detailFiltered.slice(start,start+PAGE_SZ);
  const pFieldDefs=[
    {idKey:'p1_id',dateKey:'p1_date',hrsKey:'p1_hrs'},
    {idKey:'p2_id',dateKey:'p2_date',hrsKey:'p2_hrs'},
    {idKey:'p3_id',dateKey:'p3_date',hrsKey:'p3_hrs'},
    {idKey:'p4_id',dateKey:'p4_date',hrsKey:'p4_hrs'},
    {idKey:'p5_id',dateKey:'p5_date',hrsKey:'p5_hrs'},
    {idKey:'p6_id',dateKey:'p6_date',hrsKey:'p6_hrs'},
  ];
  let html='';
  rows.forEach((r,idx)=>{
    const absIdx=start+idx;
    const p=parseNum(r[C.persons]);
    const h=parseNum(r[C.hours]);
    const amt=h*PRICE_PER_HOUR;
    const org=(r[C.org]||'').trim()||'（未填）';
    if(!org||org==='（未填）') return;
    const ids=pFieldDefs.map(f=>({
      id:(r[C[f.idKey]]||'').toString().replace(/\n|\r/g,'').trim().toUpperCase()||'',
      date:excelToRoc(r[C[f.dateKey]]||''),
      hrs:parseNum(r[C[f.hrsKey]])||1,
    }));
    const filledIds=ids.filter(i=>i.id);
    const missing=Math.max(0,p-filledIds.length);
    const st=rowIdStatus(ids,p);
    const isOpen=!!_detailExpandState[absIdx];
    const btnCls=st==='danger'?'chip chip-red':st==='warn'?'chip chip-orange':'chip chip-blue';
    let btnTxt='';
    if(st==='danger') btnTxt=missing>0?'⚠ 缺漏'+missing+'筆':'⚠ 格式有誤';
    else if(st==='warn') btnTxt='▲ '+filledIds.length+'人（格式警示）';
    else btnTxt=filledIds.length+'人';
    const arrow=isOpen?'▴':'▾';
    html+=`<tr style="border-bottom:1px solid var(--g200)">
      <td>${excelToRoc(r[C.date])}</td>
      <td class="bold">${org}</td>
      <td class="center">${p>0?p:'—'}</td>
      <td class="center">${h>0?h.toFixed(1):'—'}</td>
      <td class="right">${h>0?fmtMoney(amt):'—'}</td>
      <td><button onclick="toggleDetailRow(${absIdx})" style="display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--g200);border-radius:4px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit;color:var(--g600)">${btnTxt} ${arrow}</button></td>
    </tr>`;
    if(isOpen){
      const slots=[];
      for(let pi=0;pi<p;pi++) slots.push(ids[pi]||{id:'',date:'',hrs:1});
      const itemsHtml=slots.map((slot,pi)=>{
        const v=validateId(slot.id);
        const cls=v.status;
        const idText=slot.id||'（未填）';
        const bgMap={ok:'var(--blue-bg)',warn:'#fff8e1',danger:'var(--red-bg)',missing:'var(--g100)'};
        const colorMap={ok:'var(--blue)',warn:'var(--orange)',danger:'var(--red)',missing:'var(--g400)'};
        const borderMap={ok:'var(--blue)',warn:'#f9c74f',danger:'#ffcdd2',missing:'var(--g300)'};
        const bg=bgMap[cls];const fc=colorMap[cls];const bc=borderMap[cls];
        const errTag=v.msg?`<div style="font-size:10px;margin-top:3px;color:${fc}">${v.msg}</div>`:'';
        return `<div style="background:${bg};border:1px solid ${bc};border-radius:6px;padding:7px 10px">
          <div style="font-size:10px;color:var(--g400);margin-bottom:2px">第 ${pi+1} 人</div>
          <div style="font-size:12px;font-weight:500;color:${fc};margin-bottom:2px">${idText}</div>
          <div style="font-size:11px;color:var(--g400)">${slot.date||'—'}${slot.hrs?' · '+slot.hrs+'hr':''}</div>
          ${errTag}
        </div>`;
      }).join('');
      html+=`<tr style="background:var(--g100);border-bottom:1px solid var(--g200)">
        <td colspan="6" style="padding:10px 14px">
          <div style="font-size:11px;font-weight:500;color:var(--g400);margin-bottom:8px">使用者識別碼明細${missing>0?'　<span style="color:var(--red)">（缺漏 '+missing+' 筆識別碼）</span>':''}</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px">${itemsHtml}</div>
        </td>
      </tr>`;
    }
  });
  document.getElementById('detail-tbody').innerHTML=html;
  renderPager('detail',total,detailPage,p=>{detailPage=p;renderDetailTable();});
}

/* ══ 通用分頁器 ══ */
function renderPager(key,total,cur,cb){
  const pages=Math.ceil(total/PAGE_SZ);
  const el=document.getElementById(key+'-pager');
  if(pages<=1){el.innerHTML='';return;}
  let h=`<button onclick="(${cb.toString()})(${cur-1})" ${cur===1?'disabled':''}>‹</button>`;
  for(let i=1;i<=pages;i++){
    if(i===1||i===pages||Math.abs(i-cur)<=2)
      h+=`<button class="${i===cur?'active':''}" onclick="(${cb.toString()})(${i})">${i}</button>`;
    else if(Math.abs(i-cur)===3) h+=`<button disabled>…</button>`;
  }
  h+=`<button onclick="(${cb.toString()})(${cur+1})" ${cur===pages?'disabled':''}>›</button>`;
  el.innerHTML=h;
}
</script>
