const API_URL  = 'https://script.google.com/macros/s/AKfycbwhb3v0uuaCG6OEphEHP735CalnL0BvpDVei2fjRdBpPI0OEzj7ySfp8Y5QKRbg7vaxJQ/exec';  // 您的 Apps Script /exec 網址
const PASSWORD = 'khedu2025';                  // 系統登入密碼（請自行更改）

/* 規則 */
const PRICE_PER_HOUR = 1600;
const MAX_SESSIONS   = 12;

/* 欄位名稱（對應您的 Google 試算表） */
const C = {

  p2_date: ' 第2人-  使用服務日期(如：1150430)',

  p3_date: '第3人 - 使用服務日期(如：1150430)',

  p4_date: '第4人 - 使用服務日期(如：1150430)',
  p4_hrs:  '第4人 -  使用服務時數(如：1)',
  p5_id:   '第5人 -使用者補助識別碼(身分別+身分證英文字母+身分證後4碼數字+生日月分+生日日期，如AA01230101)',
  p5_date: '第5人 - 使用服務日期(如：1150430)',

};

/* ── 狀態 ── */
let allRows   = [];
let idMap     = {};   // 識別碼 → { sessions:[{date,hours,org}], totalHours }
let orgMap    = {};   // 機構名 → { rows, persons, hours }
let detailFiltered = [];
let detailPage = 1;
let idListPage = 1;
const PAGE_SZ = 20;

/* ══ 1. 機構名稱少字自動勾稽過濾器 ══ */
function standardizeOrgName(rawName) {
  if (!rawName) return '';
  let name = String(rawName).trim();
  
  // 自動修正少字或漏字的狀況（張老師高雄分務所 -> 高雄分事務所）
  if (name.includes('張老師') && name.includes('高雄分務所')) {
    return '財團法人「張老師」基金會高雄分事務所';
  }
  // 增加關鍵字防呆（若有包含張老師且包含高雄）
  if (name.includes('張老師') && name.includes('高雄') && !name.includes('分事務所')) {
    return '財團法人「張老師」基金會高雄分事務所';
  }
  return name;
}

/* ══ 工具函數 ══ */
function parseNum(v){
  if(v===null||v===undefined||v==='') return 0;
  // 進一步將中文字、空白剔除以利解析
  const n=parseFloat(String(v).replace(/[人時小時次\s]/g,'').trim());
  return isNaN(n)?0:n;
}
function excelToRoc(v){
  if(!v) return '—';
  const s=String(v).trim();
  if(/^\d{7}$/.test(s)) return s.slice(0,3)+'/'+s.slice(3,5)+'/'+s.slice(5,7);
  const num=parseFloat(s);
  if(!isNaN(num)&&num>40000){
    const d=new Date(Math.round((num-25569)*86400*1000));
    return (d.getFullYear()-1911)+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
  }
  return s;
}

/* ══ 2. 全面重構：可通殺所有文字日期格式與數字格式的 getMonthKey ══ */
function getMonthKey(row){
  const ts = row['時間戳記'];
  if (!ts) return '—';
  
  let d;
  const num = parseFloat(String(ts).trim());
  
  // 情況 A：如果是 Excel 數字序號型態
  if (!isNaN(num) && num > 40000) {
    d = new Date(Math.round((num - 25569) * 86400 * 1000));
  } else {
    // 情況 B：標準 Google 表單日期文字（例如 "2026/5/20 下午 12:53:40"）
    // 先移除所有中文字（如 上午/下午），並將 "-" 換成 "/" 確保所有瀏覽器皆能正常執行 Date.parse
    let cleanTs = String(ts).replace(/[\u4e00-\u9fa5]/g, '').replace(/-/g, '/').trim();
    d = new Date(cleanTs);
    
    // 如果直接解析仍失敗，嘗試暴力切出前兩個斜線的日期部分
    if (isNaN(d.getTime())) {
      const match = cleanTs.match(/^(\d{4})[\/\-]\d{1,2}[\/\-]\d{1,2}/);
      if (match) {
        d = new Date(match[0]);
      }
    }
  }
  
  // 檢查 Date 物件若依然無效，回傳未填
  if (!d || isNaN(d.getTime())) return '—';
  
  // 轉換成與選單對應的格式（例如 "115年05月"）
  const rocYear = d.getFullYear() - 1911;
  const m = String(d.getMonth() + 1).padStart(2, '0');
  return rocYear + '年' + m + '月';
}
function fmtMoney(n){ return "NT$ "+Math.round(n).toLocaleString(); }
function pct(a,b){ return b===0?0:Math.round(a/b*100); }

/* ══ 登入 / 登出 ══ */
function doLogin(){
  const pw=document.getElementById('pw-input').value;
  if(pw===PASSWORD){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    loadData();
  } else {
    document.getElementById('login-err').textContent='密碼錯誤，請重新輸入';
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
  }
}
function doLogout(){
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('pw-input').value='';
  document.getElementById('login-err').textContent='';
}

/* ══ TAB 切換 ══ */
function switchTab(i){
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',i===j));
  document.querySelectorAll('.tab-pane').forEach((p,j)=>p.classList.toggle('active',i===j));
}

/* ══ 資料處理 ══ */
function buildIdMap(rows){
  const m={};
  const pFields=[
    {id:C.p1_id, date:C.p1_date, hrs:C.p1_hrs},
    {id:C.p2_id, date:C.p2_date, hrs:C.p2_hrs},
    {id:C.p3_id, date:C.p3_date, hrs:C.p3_hrs},
    {id:C.p4_id, date:C.p4_date, hrs:C.p4_hrs},
    {id:C.p5_id, date:C.p5_date, hrs:C.p5_hrs},
    {id:C.p6_id, date:C.p6_date, hrs:C.p6_hrs},
  ];
  rows.forEach(row=>{
    // 套用機構名稱標準化
    const org=standardizeOrgName(row[C.org]);
    pFields.forEach(f=>{
      const rawId=(row[f.id]||'').toString().trim().toUpperCase();
      if(!rawId) return;
      const d=excelToRoc(row[f.date]);
      const h=parseNum(row[f.hrs])||1;
      if(!m[rawId]) m[rawId]={sessions:[],totalHours:0};
      m[rawId].sessions.push({date:d,hours:h,org});
      m[rawId].totalHours+=h;
    });
  });
  return m;
}

function buildOrgMap(rows){
  const m={};
  rows.forEach(row=>{
    // 套用機構名稱標準化
    const org=standardizeOrgName(row[C.org]);
    if(!org) return;
    const p=parseNum(row[C.persons]);
    const h=parseNum(row[C.hours]);
    if(!m[org]) m[org]={rowCount:0,persons:0,hours:0};
    m[org].rowCount++;
    m[org].persons+=p;
    m[org].hours+=h;
  });
  return m;
}

/* ══ 載入資料 ══ */
async function loadData(){
  document.getElementById('overview-loading').style.display='block';
  document.getElementById('overview-content').style.display='none';
  try{
    const res=await fetch(API_URL);
    const data=await res.json();
    allRows=Array.isArray(data)?data:[];
    idMap=buildIdMap(allRows);
    orgMap=buildOrgMap(allRows);
    const now=new Date().toLocaleString('zh-TW');
    document.getElementById('last-update').textContent=now;
    document.getElementById('last-update-label').textContent=now+' 更新';
    buildFilters();
    renderOverview();
    renderIDList();
    renderOrgTable();
    detailFiltered=[...allRows];
    renderDetailTable();
    document.getElementById('overview-loading').style.display='none';
    document.getElementById('overview-content').style.display='block';
  } catch(e){
    document.getElementById('overview-loading').innerHTML=
      '<div class="error-box">⚠️ 資料載入失敗，請確認 API 網址設定是否正確，且 Apps Script 權限已設為「任何人」。<br><small>'+e.message+'</small></div>';
    console.error(e);
  }
}

    </div>

      <div class="scard-value">${orgs.size}</div>

      <div class="scard-label">已填報筆數</div>
      <div class="scard-value">${allRows.filter(r=>r['時間戳記']).length}</div>

/* ══ 3. 修正當月統計數據加總邏輯 ══ */
function renderMonthStats(){
  const m=document.getElementById('month-select').value;
  if(!m){document.getElementById('month-cards').innerHTML='<div style="color:var(--g400);font-size:13px;grid-column:1/-1">請選擇上方月份</div>';return;}
  
  // 核心篩選
  const rows=allRows.filter(r=>getMonthKey(r)===m);
  
  let p=0,h=0;
  rows.forEach(r=>{
    // 防呆：抽離欄位中可能包含的非數字文字符號再做加總
    const rawP = String(r[C.persons] || '0').replace(/[^0-9.]/g, '');
    const rawH = String(r[C.hours] || '0').replace(/[^0-9.]/g, '');
    p += parseFloat(rawP) || 0;
    h += parseFloat(rawH) || 0;
  });
  
  const amt=h*PRICE_PER_HOUR;
  document.getElementById('month-cards').innerHTML=`
    <div class="scard">
      <div class="scard-label">${m}　人次</div>
      <div class="scard-value">${p}</div>
      <div class="scard-unit">人次</div>
    </div>
    <div class="scard green">
      <div class="scard-label">${m}　時數</div>
      <div class="scard-value">${h.toFixed(1)}</div>
      <div class="scard-unit">小時</div>
    </div>
    <div class="scard gold">
      <div class="scard-label">${m}　可核銷金額</div>
      <div class="scard-value" style="font-size:20px">${fmtMoney(amt)}</div>
      <div class="scard-unit">元</div>
    </div>
    <div class="scard blue">
      <div class="scard-label">${m}　填報筆數</div>
      <div class="scard-value">${rows.length}</div>
      <div class="scard-unit">筆</div>
    </div>
  `;
}

/* ══ 識別碼查詢 ══ */
function searchID(){
  const q=document.getElementById('id-input').value.trim().toUpperCase();
  const area=document.getElementById('id-result-area');
  if(q.length<4){area.innerHTML='<div style="color:var(--g400);font-size:13px">請輸入至少4個字元</div>';return;}
  const matches=Object.keys(idMap).filter(k=>k.includes(q));
  if(matches.length===0){area.innerHTML='<div style="color:var(--g400);font-size:13px">查無符合識別碼</div>';return;}

  area.innerHTML=matches.map(id=>{
    const d=idMap[id];
    const sessions=d.sessions.length;
    const hrs=d.totalHours;
    const amt=hrs*PRICE_PER_HOUR;
    const remain=MAX_SESSIONS-sessions;
    const p=pct(sessions,MAX_SESSIONS);
    const barClass=p>=100?'danger':p>=75?'warn':'';
    const dates=[...new Set(d.sessions.map(s=>s.date))].sort();
    return `<div class="id-result">
      <div class="id-name">識別碼：${id}</div>
      <div class="id-grid">
        <div class="id-kv"><div class="k">使用次數</div><div class="v">${sessions}<span class="unit"> 次</span></div></div>
        <div class="id-kv"><div class="k">使用時數</div><div class="v">${hrs.toFixed(1)}<span class="unit"> 小時</span></div></div>
        <div class="id-kv"><div class="k">可核銷金額</div><div class="v" style="font-size:15px">${fmtMoney(amt)}</div></div>
        <div class="id-kv"><div class="k">剩餘次數</div><div class="v" style="color:${remain<=0?'var(--red)':'var(--green)'}">${remain<=0?'已達上限':remain}<span class="unit"> 次</span></div></div>
      </div>
      <div class="quota-bar">
        <div class="quota-label"><span>使用進度</span><span>${sessions} / ${MAX_SESSIONS} 次</span></div>
        <div class="prog-wrap"><div class="prog-bar ${barClass}" style="width:${Math.min(p,100)}%"></div></div>
      </div>
      <div class="id-dates">
        <div class="id-dates-title">使用日期紀錄</div>
        <div class="date-chips">${dates.map(dt=>`<span class="date-chip">${dt}</span>`).join('')}</div>
      </div>
    </div>`;
  }).join('');
}

/* ══ 識別碼列表 ══ */
function renderIDList(){
  const all=Object.entries(idMap).map(([id,d])=>({id,sessions:d.sessions.length,hours:d.totalHours,lastDate:[...d.sessions].sort((a,b)=>b.date.localeCompare(a.date))[0]?.date||'—'}));
  all.sort((a,b)=>b.sessions-a.sessions);
  document.getElementById('id-list-meta').textContent='共 '+all.length+' 人';
  const start=(idListPage-1)*PAGE_SZ;
  const rows=all.slice(start,start+PAGE_SZ);
  document.getElementById('id-tbody').innerHTML=rows.map(r=>{
    const remain=MAX_SESSIONS-r.sessions;
    const p=pct(r.sessions,MAX_SESSIONS);
    const barClass=p>=100?'danger':p>=75?'warn':'';
    const amt=r.hours*PRICE_PER_HOUR;
    const chip=remain<=0?'<span class="chip chip-red">已達上限</span>':p>=75?'<span class="chip chip-orange">'+remain+' 次</span>':'<span class="chip chip-green">'+remain+' 次</span>';
    return `<tr>
      <td><span class="chip chip-blue">${r.id}</span></td>
      <td class="center bold">${r.sessions}</td>
      <td class="center">${r.hours.toFixed(1)}</td>
      <td class="right">${fmtMoney(amt)}</td>
      <td class="center">${chip}</td>
      <td><div class="prog-wrap" style="min-width:100px"><div class="prog-bar ${barClass}" style="width:${Math.min(p,100)}%"></div></div></td>
      <td>${r.lastDate}</td>
    </tr>`;
  }).join('');
  renderPager('id',all.length,idListPage,p=>{idListPage=p;renderIDList();});
}

/* ══ 機構統計 ══ */

  const orgs=Object.entries(orgMap).sort((a,b)=>b[1].hours-a[1].hours);
  document.getElementById('org-tbody').innerHTML=orgs.map(([org,d])=>{
    const amt=d.hours*PRICE_PER_HOUR;
    const p=pct(d.hours,totalHours);
    return `<tr>
      <td class="bold">${org}</td>
      <td class="center">${d.rowCount}</td>
      <td class="center">${d.persons}</td>
      <td class="center">${d.hours.toFixed(1)}</td>
      <td class="right bold" style="color:var(--navy-mid)">${fmtMoney(amt)}</td>
      <td><div style="display:flex;align-items:center;gap:8px">
        <div class="prog-wrap" style="min-width:80px"><div class="prog-bar" style="width:${p}%"></div></div>
        <span style="font-size:12px;color:var(--g400)">${p}%</span>
      </div></td>
    </tr>`;
  }).join('');
  const tAmt=totalHours*PRICE_PER_HOUR;
  const tP=Object.values(orgMap).reduce((s,v)=>s+v.persons,0);
  document.getElementById('org-tfoot').innerHTML=`
    <tr style="background:var(--g100);font-weight:600">
      <td style="padding:10px 14px;font-size:13px;color:var(--g800)">合　計</td>
      <td class="center" style="padding:10px 14px;font-size:13px">—</td>
      <td class="center" style="padding:10px 14px;font-size:13px">${tP}</td>
      <td class="center" style="padding:10px 14px;font-size:13px">${totalHours.toFixed(1)}</td>
      <td class="right" style="padding:10px 14px;font-size:13px;color:var(--navy-mid)">${fmtMoney(tAmt)}</td>
      <td style="padding:10px 14px;font-size:13px">100%</td>
    </tr>`;
}

/* ══ 填報明細選單 ══ */
function buildFilters(){
  const orgs=[...new Set(allRows.map(r=>standardizeOrgName(r[C.org])).filter(Boolean))].sort();
  ['d-org'].forEach(id=>{
    const sel=document.getElementById(id);
    sel.innerHTML='<option value="">── 全部機構 ──</option>';
    orgs.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;sel.appendChild(op);});
  });
  // 月份選單固定 115年 1～12 月
  ['d-month'].forEach(id=>{
    const sel=document.getElementById(id);
    sel.innerHTML='<option value="">── 全部月份 ──</option>';
    for(let i=1;i<=12;i++){
      const key='115年'+String(i).padStart(2,'0')+'月';
      const label='115年 '+i+' 月';
      const op=document.createElement('option');
      op.value=key; op.textContent=label; sel.appendChild(op);
    }
  });
}

function applyDetailFilter(){
  const org=document.getElementById('d-org').value;
  const month=document.getElementById('d-month').value;
  const kw=document.getElementById('d-keyword').value.trim().toLowerCase();
  detailFiltered=allRows.filter(r=>{
    if(org&&standardizeOrgName(r[C.org])!==org) return false;
    if(month&&getMonthKey(r)!==month) return false;
    if(kw){const s=Object.values(r).map(v=>String(v||'').toLowerCase()).join(' ');if(!s.includes(kw)) return false;}
    return true;
  });
  detailPage=1;
  renderDetailTable();
}

function renderDetailTable(){
  const total=detailFiltered.length;
  document.getElementById('detail-meta').innerHTML='查詢結果　<span class="meta-badge">共 '+total+' 筆</span>';
  const start=(detailPage-1)*PAGE_SZ;
  const rows=detailFiltered.slice(start,start+PAGE_SZ);
  document.getElementById('detail-tbody').innerHTML=rows.map(r=>{
    const p=parseNum(r[C.persons]);
    const h=parseNum(r[C.hours]);
    const amt=h*PRICE_PER_HOUR;
    const org=standardizeOrgName(r[C.org])||'（未填）';
    const p1id=(r[C.p1_id]||'').trim().toUpperCase();
    const p1d=excelToRoc(r[C.p1_date]);
    if(!org||org==='（未填）') return '';
    return `<tr>
      <td>${excelToRoc(r[C.date])}</td>
      <td class="bold">${org}</td>
      <td class="center">${p>0?p:'—'}</td>
      <td class="center">${h>0?h.toFixed(1):'—'}</td>
      <td class="right">${h>0?fmtMoney(amt):'—'}</td>
      <td>${p1id?'<span class="chip chip-blue">'+p1id+'</span>':'—'}</td>
      <td>${p1d}</td>
    </tr>`;
  }).join('');
  renderPager('detail',total,detailPage,p=>{detailPage=p;renderDetailTable();});
}

/* ══ 通用分頁器 ══ */
function renderPager(key,total,cur,cb){
  const pages=Math.ceil(total/PAGE_SZ);
  const el=document.getElementById(key+'-pager');
  if(pages<=1){el.innerHTML='';return;}
  let h=`<button onclick="(${cb.toString()})(${cur-1})" ${cur===1?'disabled':''}>‹</button>`;
  for(let i=1;i<=pages;i++){
    if(i===1||i===pages||Math.abs(i-cur)<=2)
      h+=`<button class="${i===cur?'active':''}" onclick="(${cb.toString()})(${i})">${i}</button>`;
    else if(Math.abs(i-cur)===3) h+=`<button disabled>…</button>`;
  }
  h+=`<button onclick="(${cb.toString()})(${cur+1})" ${cur===pages?'disabled':''}>›</button>`;
  el.innerHTML=h;
}
</script>
